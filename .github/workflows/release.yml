name: Release UnixPadelST

# Ne zaman tetiklenir:
#   1. main'e v* tag push edildiğinde (örn: git tag v0.2.0 && git push --tags)
#   2. Actions sayfasından manuel "Run workflow" ile (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (örn: 0.2.0) — package.json ile aynı olmalı'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: CrmModern.Web/package-lock.json

      - name: Install dependencies
        working-directory: CrmModern.Web
        run: npm ci

      - name: Build application
        working-directory: CrmModern.Web
        run: npm run build

      - name: Package with electron-builder
        working-directory: CrmModern.Web
        run: npx electron-builder

      - name: Build complete
        if: success()
        run: |
          echo "Build completed successfully!"
          echo "Release artifacts are ready at: release/UnixPadelST-Setup-*.exe"
