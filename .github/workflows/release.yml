name: Release UnixPadelST

# Ne zaman tetiklenir:
#   1. main'e v* tag push edildiğinde (örn: git tag v0.2.0 && git push --tags)
#   2. Actions sayfasından manuel "Run workflow" ile (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (örn: 0.2.0) — package.json ile aynı olmalı'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CrmModern.Web/package-lock.json

      - name: Install dependencies
        working-directory: CrmModern.Web
        run: npm ci

      - name: Build & publish (electron-builder)
        working-directory: CrmModern.Web
        env:
          # RELEASES_TOKEN: UnixPadel/UnixPadelST-Releases repo'suna yazma yetkisi
          # olan Personal Access Token. Bkz: Settings → Secrets → Actions.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npm run release

      - name: Show release URL
        if: success()
        run: |
          echo "Release oluşturuldu (draft olarak):"
          echo "https://github.com/UnixPadel/UnixPadelST-Releases/releases"
          echo ""
          echo "Yayına almak için: ilgili draft → Edit → Publish release."
